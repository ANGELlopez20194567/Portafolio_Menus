<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Formulario de contacto de Rayel Tech." />
    <link rel="icon" type="image/svg+xml" href="../../favicon.svg" />
    <title>Contacto | rayeltech.lat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="contact-experience">
      <section class="intro-panel" aria-labelledby="contact-title">
        <a class="brand" href="../landing/" aria-label="rayeltech.lat, volver al portafolio">rayeltech<span>.lat</span></a>
        <div class="title-group">
          <h1 id="contact-title">Tu menú<br />empieza aquí.</h1>
          <p class="intro">Creamos experiencias digitales que abren el apetito.</p>
        </div>
        <nav class="menu-references" aria-label="Conoce nuestros menús">
          <a href="../classic/">01 Classic</a>
          <a href="../menu-informativo/">02 Informative</a>
          <a href="../menu-interactivo/">03 Interactive</a>
          <a href="../reservas-estatico/reservar.html">04 Reservations</a>
        </nav>
      </section>

      <section class="form-panel" aria-labelledby="form-title">
        <div class="form-heading">
          <p class="form-kicker">CONTACTO</p>
          <h2 id="form-title">Cuéntanos tu idea</h2>
        </div>
        <form id="contact-form" novalidate>
          <div class="field field-name">
          <label for="name">Nombre</label>
          <input id="name" name="name" type="text" autocomplete="name" required />
        </div>

        <div class="field field-phone">
          <label for="phone">Número telefónico</label>
          <input id="phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" required />
        </div>

        <div class="field field-email">
          <label for="email">Correo electrónico</label>
          <input id="email" name="email" type="email" autocomplete="email" required />
        </div>

        <div class="field field-message">
          <label for="message">Mensaje <span>(opcional)</span></label>
          <textarea id="message" name="message" rows="5" placeholder="Cuéntanos un poco más..."></textarea>
        </div>

        <button type="submit">Enviar mensaje</button>
        <p id="form-status" class="form-status" aria-live="polite"></p>
      </form>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
